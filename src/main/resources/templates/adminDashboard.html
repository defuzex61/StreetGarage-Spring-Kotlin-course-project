<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <!-- Подключаем Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Навигация -->
<div th:insert="nav"></div>

<div class="container mt-5">
  <h1 class="mb-4">Admin Dashboard</h1>
  <a th:href="@{/admin/export-csv}" class="btn btn-primary mb-3">
    Export to CSV
  </a>
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
      <th>User ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Middle Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Role</th>
      <th>Car ID</th>
      <th>Reg Number</th>
      <th>Make</th>
      <th>Model</th>
      <th>Car Year</th>
      <th>VIN</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="userCar : ${userCarsData}">
      <td th:text="${userCar.userId}"></td>
      <td th:text="${userCar.firstName}"></td>
      <td th:text="${userCar.lastName}"></td>
      <td th:text="${userCar.middleName}"></td>
      <td th:text="${userCar.email}"></td>
      <td th:text="${userCar.phone}"></td>
      <td th:text="${userCar.role}"></td>
      <td th:text="${userCar.carId}"></td>
      <td th:text="${userCar.regNumber}"></td>
      <td th:text="${userCar.make}"></td>
      <td th:text="${userCar.model}"></td>
      <td th:text="${userCar.carYear}"></td>
      <td th:text="${userCar.vin}"></td>
    </tr>
    </tbody>
  </table>
</div>

<!-- Футер -->
<div th:insert="footer"></div>

<!-- Подключаем Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
